<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in to Job Platform</title>
</head>
<body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #111;">
  <h1 style="font-size: 1.25rem;">Sign in to Job Platform</h1>
  <p>Click the button below to sign in. This link expires in 15 minutes and works once.</p>
  <p style="margin: 1.5rem 0;">
    <a href="{{ verify_url }}"
       style="display: inline-block; background: #2563eb; color: #fff; padding: 0.75rem 1.25rem;
              border-radius: 0.5rem; text-decoration: none; font-weight: 600;">
      Sign in
    </a>
  </p>
  <p style="font-size: 0.875rem; color: #555;">
    Or copy this URL into your browser:<br>
    <span style="word-break: break-all;">{{ verify_url }}</span>
  </p>
  <p style="font-size: 0.875rem; color: #777;">If you did not request this email, you can ignore it.</p>
</body>
</html>
