apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: jobs-platform
  labels:
    app.kubernetes.io/name: job-platform
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: job-platform
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-platform
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: job-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: job-platform-config
            - secretRef:
                name: job-platform-secrets
          volumeMounts:
            - name: resumes
              mountPath: /data/resumes
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: resumes
          persistentVolumeClaim:
            claimName: job-platform-resumes
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
