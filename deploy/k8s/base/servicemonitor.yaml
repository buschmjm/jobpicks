apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: job-platform-api
  namespace: jobs-platform
  labels:
    app.kubernetes.io/name: job-platform
    app.kubernetes.io/component: api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: job-platform
      app.kubernetes.io/component: api
  namespaceSelector:
    matchNames:
      - jobs-platform
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
