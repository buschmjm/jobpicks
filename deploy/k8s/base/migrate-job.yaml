apiVersion: batch/v1
kind: Job
metadata:
  name: job-platform-migrate
  namespace: jobs-platform
  labels:
    app.kubernetes.io/name: job-platform
    app.kubernetes.io/component: migrate
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-platform
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: job-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: job-platform-config
            - secretRef:
                name: job-platform-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
