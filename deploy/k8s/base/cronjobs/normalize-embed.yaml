apiVersion: batch/v1
kind: CronJob
metadata:
  name: normalize-embed
  labels:
    app.kubernetes.io/name: job-platform
    app.kubernetes.io/component: cronjob
spec:
  schedule: "30 2 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: job-platform
            app.kubernetes.io/component: cronjob
        spec:
          restartPolicy: OnFailure
          containers:
            - name: worker
              image: job-platform:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "workers", "job", "normalize-embed"]
              envFrom:
                - configMapRef:
                    name: job-platform-config
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
