[project]
name = "job-platform"
version = "0.1.0"
description = "AI Job Discovery Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "pgqueuer>=0.24.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.23.0",
    "jinja2>=3.1.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "PyJWT[crypto]>=2.10.0",
    "playwright>=1.49.0",
    "stripe>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
    "types-jsonschema>=4.23.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "ingest*", "inference*", "workers*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["api", "core", "ingest", "inference", "workers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"api/routers/*.py" = ["B008"]
"tests/**/*.py" = ["SIM117"]
"migrations/**/*.py" = ["E501"]
"core/models.py" = ["UP042"]
"core/constraints.py" = ["SIM102"]
"core/scoring.py" = ["SIM102"]
"api/resume_parse.py" = ["SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pgqueuer.*", "pgvector.*", "yaml.*", "jsonschema.*", "pypdf", "docx"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "workers.*",
    "core.queue_builder",
    "core.database",
    "core.preference",
    "ingest.adapters.*",
    "api.services.*",
    "api.repositories.*",
    "inference.client",
    "playwright.*",
]
disallow_untyped_defs = false
check_untyped_defs = false
